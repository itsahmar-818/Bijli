<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f5ead8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Bijli" />
<meta name="description" content="MEPCO dual-meter consumption tracker" />
<title>Bijli — Meter Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   Organic design system — tokens copied verbatim from styles.css so
   this file stays standalone (no _ds/ folder needed on GitHub Pages).
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --color-bg:#f5ead8;
  --color-surface:#ebddc5;
  --color-text:#201e1d;
  --color-accent:#c67139;
  --color-accent-2:#7a8a5e;
  --color-divider:color-mix(in srgb,#201e1d 16%,transparent);

  --color-neutral-100:#f9f4ed; --color-neutral-200:#eee7db; --color-neutral-300:#dcd3c4;
  --color-neutral-400:#c0b6a5; --color-neutral-500:#a19786; --color-neutral-600:#82796a;
  --color-neutral-700:#645c50; --color-neutral-800:#474238; --color-neutral-900:#2e2b25;

  --color-accent-100:#fff2eb; --color-accent-200:#ffe1d0; --color-accent-300:#ffc6a5;
  --color-accent-400:#f6a06b; --color-accent-500:#d67f48; --color-accent-600:#b2622d;
  --color-accent-700:#8c491a; --color-accent-800:#643312; --color-accent-900:#402310;

  --color-accent-2-100:#f0fae1; --color-accent-2-200:#e1eecc; --color-accent-2-300:#ccdbb2;
  --color-accent-2-400:#aebf92; --color-accent-2-500:#8fa073; --color-accent-2-600:#728157;
  --color-accent-2-700:#56633f; --color-accent-2-800:#3d472b; --color-accent-2-900:#272e1b;

  /* Extension: the system carries no alarm role, and a cost-cliff tracker
     needs one. Kept in the warm family so it sits with the terracotta. */
  --color-alert:#b8402a; --color-alert-100:#ffe3db; --color-alert-700:#8a2a17;

  --font-heading:"Caprasimo",system-ui,sans-serif;
  --font-heading-weight:400;
  --font-body:"Figtree",system-ui,-apple-system,sans-serif;

  --space-1:4.4px; --space-2:8.8px; --space-3:13.2px;
  --space-4:17.6px; --space-6:26.4px; --space-8:35.2px;

  --radius-sm:8px; --radius-md:16px; --radius-lg:28px;

  --shadow-sm:0 1px 2px color-mix(in srgb,#2e2b25 14%,transparent);
  --shadow-md:0 3px 10px color-mix(in srgb,#2e2b25 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2e2b25 22%,transparent);

  --bar-h:66px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--color-bg);}
body{
  margin:0;background:var(--color-bg);color:var(--color-text);
  font-family:var(--font-body);font-size:15px;line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);font-weight:var(--font-heading-weight);
  line-height:1.12;letter-spacing:-.015em;margin:0 0 var(--space-2);}
button,input{font-family:inherit;font-size:inherit;color:inherit;-webkit-appearance:none;appearance:none;border:none;background:none;}
button{cursor:pointer;}
input[type="date"]{color-scheme:light;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent);}

/* ─── shell ─────────────────────────────────────────────── */
#shell{max-width:440px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh;}
#shell::before{
  content:'';position:fixed;top:-90px;right:-70px;width:260px;height:260px;border-radius:50%;
  background:color-mix(in srgb,var(--color-accent) 13%,transparent);pointer-events:none;z-index:0;
}
#shell::after{
  content:'';position:fixed;top:130px;left:-95px;width:190px;height:190px;border-radius:50%;
  background:color-mix(in srgb,var(--color-accent-2) 14%,transparent);pointer-events:none;z-index:0;
}

.appbar{position:sticky;top:0;z-index:50;
  padding:calc(var(--sat) + var(--space-4)) var(--space-4) var(--space-3);
  background:linear-gradient(to bottom,var(--color-bg) 74%,transparent);
  display:flex;align-items:center;gap:var(--space-3);}
.mark{width:38px;height:38px;border-radius:999px;flex:none;background:var(--color-accent);
  display:grid;place-items:center;box-shadow:var(--shadow-sm);}
.brand{margin-right:auto;min-width:0;}
.brand .n{font-family:var(--font-heading);font-size:22px;line-height:1;}
.brand .s{font-size:10.5px;letter-spacing:.09em;color:var(--color-neutral-600);margin-top:3px;text-transform:uppercase;}

.chip{display:flex;align-items:center;gap:var(--space-2);background:var(--color-surface);
  border-radius:999px;padding:6px 13px 6px 7px;flex:none;}
.chip .t{line-height:1.2;}
.chip .t b{display:block;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.chip .t span{font-size:9.5px;color:var(--color-neutral-600);}
.chip.over .t b{color:var(--color-alert);}

main{position:relative;z-index:1;padding:0 var(--space-4) calc(var(--bar-h) + var(--sab) + var(--space-8));}
.panel{display:none;animation:pin .32s cubic-bezier(.22,1,.36,1);}
.panel.on{display:block;}
@keyframes pin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--color-neutral-600);font-weight:700;margin:var(--space-6) var(--space-2) var(--space-2);}
.eyebrow.first{margin-top:var(--space-2);}

/* ─── card ──────────────────────────────────────────────── */
.card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4);
  border-radius:calc(var(--radius-lg) * 1.15);background:var(--color-surface);
  margin-bottom:var(--space-3);}
.card.flat{gap:0;}
.elev-sm{box-shadow:var(--shadow-sm);}

/* ─── tags ──────────────────────────────────────────────── */
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;
  padding:3px 11px;border-radius:999px;font-weight:600;}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800);}
.tag-accent-2{background:var(--color-accent-2-100);color:var(--color-accent-2-800);}
.tag-alert{background:var(--color-alert-100);color:var(--color-alert-700);}

/* ─── decision card ─────────────────────────────────────── */
.decide{background:var(--color-accent-100);gap:0;}
.decide .row{display:flex;align-items:center;gap:var(--space-4);}
.decide .orb{width:66px;height:66px;flex:none;border-radius:999px;display:grid;place-items:center;
  box-shadow:var(--shadow-md);}
.decide .orb span{font-family:var(--font-heading);font-size:32px;color:var(--color-bg);line-height:1;}
.decide .k{font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--color-accent-700);font-weight:700;}
.decide .h{font-family:var(--font-heading);font-size:23px;line-height:1.12;margin-top:5px;}
.decide .sub{font-size:12px;color:var(--color-neutral-700);margin-top:var(--space-3);}

/* ─── meter card ────────────────────────────────────────── */
.meter{gap:0;}
.meter.a{--ac:var(--color-accent);--ac-d:var(--color-accent-700);}
.meter.b{--ac:var(--color-accent-2);--ac-d:var(--color-accent-2-700);}
.meter .top{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);}
.meter .nm{font-family:var(--font-heading);font-size:19px;line-height:1;}
.meter .sn{font-size:10.5px;color:var(--color-neutral-600);margin-left:auto;
  font-variant-numeric:tabular-nums;}

.mrow{display:flex;align-items:center;gap:var(--space-4);}
.gauge{width:98px;height:98px;flex:none;position:relative;}
.gauge svg{width:100%;height:100%;transform:rotate(135deg);display:block;}
.gauge .trk{fill:none;stroke:var(--color-neutral-300);stroke-width:9;stroke-linecap:round;}
.gauge .prg{fill:none;stroke-width:9;stroke-linecap:round;stroke:var(--ac);
  transition:stroke-dasharray .85s cubic-bezier(.22,1,.36,1);}
.gauge .tck{stroke:var(--color-alert);stroke-width:2.6;stroke-linecap:round;}
.gc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;}
.gc .v{font-family:var(--font-heading);font-size:30px;line-height:1;color:var(--ac-d);}
.gc .l{font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--color-neutral-600);margin-top:3px;font-weight:700;}

.mside{flex:1;min-width:0;}
.head{font-family:var(--font-heading);font-size:34px;line-height:.95;color:var(--ac-d);}
.head-l{font-size:11px;color:var(--color-neutral-700);margin-top:3px;}

.msplit{display:flex;gap:var(--space-2);margin-top:var(--space-4);
  padding-top:var(--space-3);border-top:1px solid var(--color-divider);}
.msplit div{flex:1;}
.msplit .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--color-neutral-600);font-weight:700;}
.msplit .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}
.msplit .v.alert{color:var(--color-alert);}

/* ─── estimate ──────────────────────────────────────────── */
.est{flex-direction:row;gap:0;padding:0;overflow:hidden;}
.est > div{flex:1;padding:var(--space-4);}
.est > div + div{border-left:1px solid var(--color-divider);}
.est .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--color-neutral-600);font-weight:700;}
.est .v{font-family:var(--font-heading);font-size:19px;margin-top:6px;line-height:1.1;}
.est .r{font-size:11px;color:var(--color-neutral-600);font-variant-numeric:tabular-nums;}

/* ─── legend ────────────────────────────────────────────── */
.legend{display:flex;gap:var(--space-2);margin-bottom:var(--space-3);}
.legend div{flex:1;background:var(--color-surface);border-radius:var(--radius-lg);
  padding:var(--space-3) var(--space-2);text-align:center;}
.legend .p{font-family:var(--font-heading);font-size:24px;line-height:1;}
.legend .n{font-size:10px;color:var(--color-neutral-600);margin-top:4px;}

/* ─── segmented ─────────────────────────────────────────── */
.seg{display:flex;border:1px solid var(--color-divider);border-radius:999px;
  overflow:hidden;margin:var(--space-2) 0 var(--space-3);}
.seg button{flex:1;padding:9px;font-size:13px;font-weight:600;}
.seg button + button{border-left:1px solid var(--color-divider);}
.seg button.on{color:var(--color-bg);}
.seg button.on.a{background:var(--color-accent);}
.seg button.on.b{background:var(--color-accent-2);}

/* ─── data list ─────────────────────────────────────────── */
.dl{display:flex;justify-content:space-between;gap:var(--space-4);padding:var(--space-2) 0;
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);font-size:13px;}
.dl:last-child{border-bottom:none;}
.dl dt{color:var(--color-neutral-700);flex:none;}
.dl dd{margin:0;text-align:right;font-weight:600;word-break:break-word;}
.dl dd.n{font-variant-numeric:tabular-nums;letter-spacing:.01em;}
.dl.tot{border-top:1px solid var(--color-divider);border-bottom:none;
  margin-top:var(--space-1);padding-top:var(--space-3);}
.dl.tot dt{font-family:var(--font-heading);font-size:15px;color:var(--color-text);}
.dl.tot dd{font-family:var(--font-heading);font-size:19px;font-weight:400;}
.dl dd.pos{color:var(--color-accent-2-800);}

.cpy{display:flex;align-items:center;gap:var(--space-2);justify-content:flex-end;}
.cpybtn{border:1px solid var(--color-divider);border-radius:999px;padding:3px 11px;
  font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--color-neutral-700);flex:none;}
.cpybtn:active{background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent);}

/* ─── bars ──────────────────────────────────────────────── */
.bars{display:flex;align-items:flex-end;gap:4px;padding-top:var(--space-2);}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
.bwrap{width:100%;height:74px;display:flex;align-items:flex-end;gap:2px;}
.bar{width:100%;border-radius:999px 999px var(--radius-sm) var(--radius-sm);min-height:3px;
  transition:height .7s cubic-bezier(.22,1,.36,1);}
.blab{font-size:8.5px;color:var(--color-neutral-600);white-space:nowrap;}
.blab.rot{transform:rotate(-50deg);height:13px;}

/* ─── rows ──────────────────────────────────────────────── */
.hrow{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0;
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);}
.hrow:last-child{border-bottom:none;}
.hrow .d{font-size:12px;color:var(--color-neutral-700);width:56px;flex:none;}
.hrow .x{margin-left:auto;font-size:10.5px;color:var(--color-neutral-600);font-variant-numeric:tabular-nums;}
.empty{text-align:center;padding:var(--space-8) var(--space-4);
  color:var(--color-neutral-600);font-size:13px;}

/* ─── buttons ───────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:15px;
  line-height:1.2;padding:var(--space-3) calc(var(--space-3) * 1.2);border-radius:999px;
  border:1px solid transparent;width:100%;}
.btn-primary{background:var(--color-accent);color:var(--color-bg);}
.btn-primary:active{background:var(--color-accent-700);}
.btn-secondary{border-color:var(--color-divider);}
.btn-secondary:active{background:color-mix(in srgb,var(--color-text) 14%,transparent);}
.btn + .btn{margin-top:var(--space-2);}

/* ─── FAB ───────────────────────────────────────────────── */
.fab{position:fixed;right:calc(50% - 220px + var(--space-4));
  bottom:calc(var(--bar-h) + var(--sab) + var(--space-4));z-index:60;
  width:58px;height:58px;border-radius:999px;display:grid;place-items:center;
  background:var(--color-accent);color:var(--color-bg);box-shadow:var(--shadow-lg);
  transition:transform .18s;}
.fab:active{transform:scale(.9);background:var(--color-accent-700);}
@media(max-width:472px){.fab{right:var(--space-4);}}

/* ─── tab bar ───────────────────────────────────────────── */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);z-index:70;
  height:calc(var(--bar-h) + var(--sab));padding-bottom:var(--sab);
  background:color-mix(in srgb,var(--color-surface) 93%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--shadow-md);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--color-neutral-600);transition:color .2s;}
.tab.on{color:var(--color-accent-700);}
.tab span{font-size:10px;font-weight:700;}

/* ─── sheet ─────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:80;
  background:color-mix(in srgb,var(--color-neutral-900) 50%,transparent);
  opacity:0;pointer-events:none;transition:opacity .28s;}
.scrim.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(102%);
  width:min(440px,100%);z-index:90;background:var(--color-surface);
  border-radius:calc(var(--radius-lg) * 1.4) calc(var(--radius-lg) * 1.4) 0 0;
  padding:var(--space-2) var(--space-4) calc(var(--space-6) + var(--sab));
  transition:transform .36s cubic-bezier(.22,1,.36,1);box-shadow:var(--shadow-lg);
  max-height:88vh;overflow-y:auto;}
.sheet.on{transform:translateX(-50%) translateY(0);}
.grab{width:40px;height:4px;border-radius:999px;background:var(--color-neutral-400);
  margin:0 auto var(--space-4);}
.sheet h3{font-size:24px;margin-bottom:var(--space-1);}
.sheet .sub{font-size:13px;color:var(--color-neutral-700);margin-bottom:var(--space-6);}

.field{margin-bottom:var(--space-3);}
.field > label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:700;margin-bottom:6px;color:var(--color-neutral-700);}
.field.a > label{color:var(--color-accent-700);}
.field.b > label{color:var(--color-accent-2-700);}
.input{width:100%;min-height:46px;padding:10px 16px;font:inherit;font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--color-text);caret-color:var(--color-accent);
  background:var(--color-bg);border:1px solid var(--color-divider);border-radius:999px;}
.input::placeholder{font-weight:400;color:var(--color-neutral-500);}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0;}
.field.b .input:focus-visible{border-color:var(--color-accent-2);outline-color:var(--color-accent-2);}
.frow{display:flex;gap:var(--space-2);}
.frow .field{flex:1;}
.hint{font-size:10.5px;color:var(--color-neutral-600);margin-top:5px;padding-left:14px;
  font-variant-numeric:tabular-nums;}
.err{background:var(--color-alert-100);color:var(--color-alert-700);font-size:12.5px;
  border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-3);display:none;}
.err.on{display:block;}

.toast{position:fixed;bottom:calc(var(--bar-h) + var(--sab) + var(--space-6));left:50%;
  transform:translateX(-50%) translateY(16px);z-index:100;background:var(--color-neutral-900);
  color:var(--color-neutral-100);border-radius:999px;padding:11px 22px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  box-shadow:var(--shadow-lg);white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

.foot{text-align:center;font-size:10.5px;color:var(--color-neutral-600);line-height:1.7;
  margin-top:var(--space-6);padding:0 var(--space-4);}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>
<body>
<div id="shell">
  <header class="appbar">
    <div class="mark">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="var(--color-bg)"
           stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
    </div>
    <div class="brand"><div class="n">Bijli</div><div class="s">MEPCO · Ghalla Mandi</div></div>
    <div class="chip" id="chip"></div>
  </header>

  <main>
    <section class="panel on" id="p-home"></section>
    <section class="panel" id="p-log"></section>
    <section class="panel" id="p-bills"></section>
  </main>

  <button class="fab" id="fab" aria-label="Reading add karo">
    <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor"
         stroke-width="2.75" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
  </button>

  <nav class="tabbar">
    <button class="tab on" data-tab="home">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 21v-7H9v7"/><path d="M3 10.5 12 3l9 7.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Aaj</span>
    </button>
    <button class="tab" data-tab="log">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M8 17v-3M13 17V8M18 17v-6"/></svg>
      <span>Record</span>
    </button>
    <button class="tab" data-tab="bills">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 2v20l2.5-1.5L10 22l2-1.5L14 22l2.5-1.5L19 22V2l-2.5 1.5L14 2l-2 1.5L10 2 7.5 3.5z"/>
        <path d="M9 8h6M9 12h6"/></svg>
      <span>Bills</span>
    </button>
  </nav>
</div>

/* storage: window.storage inside Claude, localStorage on GitHub Pages */
var Store={
  get:async function(k){
    if(window.storage&&window.storage.get){
      try{var r=await window.storage.get(k,false);return r&&r.value?r.value:null;}catch(e){}
    }
    try{return localStorage.getItem('bijli:'+k);}catch(e){return null;}
  },
  set:async function(k,v){
    if(window.storage&&window.storage.set){
      try{await window.storage.set(k,v,false);return true;}catch(e){}
    }
    try{localStorage.setItem('bijli:'+k,v);return true;}catch(e){return false;}
  }
};

function p2(n){return n<10?'0'+n:''+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function fmtD(iso){return new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function addMo(iso,n){var d=new Date(iso+'T00:00:00');d.setMonth(d.getMonth()+n);
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
function rs(n){return Math.round(n).toLocaleString('en-US');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function last(){return state.readings.length?state.readings[state.readings.length-1]:{a:state.baseA,b:state.baseB};}
function used(k){return Math.max(last()[k]-(k==='a'?state.baseA:state.baseB),0);}
function cycleEnd(){return addMo(state.cycleStart,1);}
function daysLeft(){return Math.max(dayDiff(today(),cycleEnd()),0);}
function cycleDay(){return Math.max(dayDiff(state.cycleStart,today()),1);}
function pace(k){return used(k)/cycleDay();}
function projected(k){return Math.round(used(k)+pace(k)*daysLeft());}

/* effective Rs/unit — calibrated against the 24 real bills above */
function rate(u){
  if(u<=50)return 22; if(u<=100)return 24; if(u<=125)return 37;
  if(u<=150)return 43; if(u<=200)return 44; if(u<=300)return 47; return 51;
}
function estimate(u){var m=u*rate(u);return{lo:Math.round(m*0.9/10)*10,hi:Math.round(m*1.1/10)*10};}
function status(u){
  if(u>=CLIFF)return{cls:'tag-alert',txt:'Cliff paar'};
  if(u>=CLIFF*0.85)return{cls:'tag-accent',txt:'Qareeb'};
  return{cls:'tag-accent-2',txt:'Mehfooz'};
}

var R=44, ARC=2*Math.PI*R*0.75;
function gaugeSVG(u){
  var frac=Math.min(u/TARGET,1);
  var rad=(135+(CLIFF/TARGET)*270)*Math.PI/180;
  var x1=(60+Math.cos(rad)*(R-7)).toFixed(1), y1=(60+Math.sin(rad)*(R-7)).toFixed(1);
  var x2=(60+Math.cos(rad)*(R+7)).toFixed(1), y2=(60+Math.sin(rad)*(R+7)).toFixed(1);
  return '<svg viewBox="0 0 120 120">'+
    '<circle class="trk" cx="60" cy="60" r="'+R+'" stroke-dasharray="'+ARC.toFixed(1)+' 999"/>'+
    '<circle class="prg" cx="60" cy="60" r="'+R+'" stroke-dasharray="'+(ARC*frac).toFixed(1)+' 999"/>'+
    '<line class="tck" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/></svg>';
}

/* ══════════════ AAJ ══════════════ */
function decideCard(){
  var la=Math.max(CLIFF-used('a'),0), lb=Math.max(CLIFF-used('b'),0), dl=daysLeft();
  if(dl===0) return '<div class="card decide elev-sm" style="background:var(--color-neutral-100)">'+
    '<div class="row"><div class="orb" style="background:var(--color-neutral-600)"><span>&#10003;</span></div>'+
    '<div><div class="k">Cycle mukammal</div><div class="h">Naya cycle shuru karo</div></div></div>'+
    '<div class="sub">Record tab mein naya baseline set kar lo.</div></div>';
  var pick=la>=lb?METERS.a:METERS.b;
  var col=pick.key==='a'?'var(--color-accent)':'var(--color-accent-2)';
  var sub=(la<=8&&lb<=8)
    ? 'Dono meters cliff ke qareeb hain — bacha hua: A '+la+', B '+lb+' units.'
    : 'Headroom: Meter A pe '+la+' units, Meter B pe '+lb+' units.';
  return '<div class="card decide elev-sm">'+
    '<div class="row"><div class="orb" style="background:'+col+'"><span>'+pick.pos+'</span></div>'+
    '<div><div class="k">Changeover switch</div><div class="h">'+pick.label+' pe rakho</div></div></div>'+
    '<div class="sub">'+sub+'</div></div>';
}

function meterCard(k){
  var m=METERS[k], u=used(k), dl=daysLeft();
  var left=Math.max(CLIFF-u,0), budget=dl>0?(left/dl).toFixed(1):'—';
  var proj=projected(k), st=status(u);
  return '<div class="card meter '+k+' elev-sm">'+
    '<div class="top"><span class="nm">'+m.label+'</span>'+
      '<span class="tag '+st.cls+'">'+st.txt+'</span>'+
      '<span class="sn">'+esc(m.meterNo)+'</span></div>'+
    '<div class="mrow">'+
      '<div class="gauge">'+gaugeSVG(u)+
        '<div class="gc"><div class="v">'+u+'</div><div class="l">units</div></div></div>'+
      '<div class="mside"><div class="head">'+left+'</div>'+
        '<div class="head-l">units bache 100 tak</div></div>'+
    '</div>'+
    '<div class="msplit">'+
      '<div><div class="k">Roz chhoot</div><div class="v">'+budget+'</div></div>'+
      '<div><div class="k">Anjaam</div><div class="v'+(proj>=CLIFF?' alert':'')+'">~'+proj+'</div></div>'+
    '</div></div>';
}

function renderHome(){

/* ══════════════ RECORD ══════════════ */
function dailyBars(){
  if(state.readings.length<2) return '';
  var segs=[];
  for(var i=1;i<state.readings.length;i++){
    var p=state.readings[i-1], c=state.readings[i], d=Math.max(dayDiff(p.date,c.date),1);
    segs.push({date:c.date,a:(c.a-p.a)/d,b:(c.b-p.b)/d});
  }
  var mx=Math.max(1,Math.max.apply(null,segs.map(function(s){return Math.max(s.a,s.b);})));
  return '<div class="eyebrow">Roz ka kharch</div><div class="card elev-sm"><div class="bars">'+
    segs.map(function(s){
      return '<div class="bcol"><div class="bwrap">'+
        '<div class="bar" style="height:'+(s.a/mx*100)+'%;background:var(--color-accent)"></div>'+
        '<div class="bar" style="height:'+(s.b/mx*100)+'%;background:var(--color-accent-2)"></div>'+
        '</div><div class="blab">'+fmtD(s.date)+'</div></div>';
    }).join('')+'</div></div>';
}

function renderLog(){
  var rows = !state.readings.length

    : '<div class="card flat elev-sm">'+state.readings.slice().reverse().map(function(r,i,arr){
        var n=arr[i+1], da=n?r.a-n.a:r.a-state.baseA, db=n?r.b-n.b:r.b-state.baseB;
        return '<div class="hrow"><span class="d">'+fmtD(r.date)+'</span>'+
          '<span class="tag tag-accent">'+r.a+'</span>'+
          '<span class="tag tag-accent-2">'+r.b+'</span>'+
          '<span class="x">+'+da+' / +'+db+'</span></div>';

    ? '<div class="eyebrow">Purane cycles</div><div class="card flat elev-sm">'+
      past.map(function(c){
        return '<div class="hrow"><span class="d" style="width:auto;flex:1">'+fmtD(c.start)+' – '+fmtD(c.end)+'</span>'+
          '<span class="tag tag-accent">'+c.uA+'</span><span class="tag tag-accent-2">'+c.uB+'</span></div>';
      }).join('')+'</div>' : '';

  document.getElementById('p-log').innerHTML=
    '<div class="eyebrow first">Is cycle ki readings</div>'+rows+dailyBars()+pastHTML+
    '<div class="eyebrow">Cycle</div>'+
    '<div class="card elev-sm">'+
      '<div class="dl"><dt>Baseline · '+fmtD(state.cycleStart)+'</dt><dd class="n">'+state.baseA+' / '+state.baseB+'</dd></div>'+
      '<div class="dl"><dt>Ab tak</dt><dd class="n">'+used('a')+' / '+used('b')+' units</dd></div>'+
      '<button class="btn btn-secondary" id="newcycle" style="margin-top:var(--space-4)">Naya cycle shuru karo</button>'+
    '</div>';
  var nc=document.getElementById('newcycle'); if(nc) nc.onclick=newCycle;

function copy(v){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(function(){toast('Copy ho gaya');},function(){toast('Copy nahi hua');});
  }else{
    var ta=document.createElement('textarea');ta.value=v;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Copy ho gaya');}catch(e){toast('Copy nahi hua');}
    document.body.removeChild(ta);
  }
}

/* ══════════════ CHIP ══════════════ */
function renderChip(){
  var dl=daysLeft(), over=dl===0;
  var total=Math.max(dayDiff(state.cycleStart,cycleEnd()),1);
  var frac=Math.min(dayDiff(state.cycleStart,today())/total,1), C=2*Math.PI*9;
  var el=document.getElementById('chip');
  el.className='chip'+(over?' over':'');
  el.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22" style="flex:none;transform:rotate(-90deg)">'+
    '<circle cx="12" cy="12" r="9" fill="none" stroke="var(--color-neutral-300)" stroke-width="3.4"/>'+
    '<circle cx="12" cy="12" r="9" fill="none" stroke="'+(over?'var(--color-alert)':'var(--color-accent)')+
      '" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="'+(C*frac).toFixed(1)+' '+C.toFixed(1)+'"/></svg>'+
    '<div class="t"><b>'+(over?'Khatam':dl+' din')+'</b><span>reading '+fmtD(cycleEnd())+'</span></div>';
}

function render(){
  renderChip();
  if(tab==='home')renderHome(); else if(tab==='log')renderLog(); else renderBills();
}

    '<div class="grab"></div><h3>Reading add karo</h3>'+
    '<div class="sub">Dono numbers, seedha meter box se.</div>'+
    '<div class="err" id="err"></div>'+
    '<div class="field"><label for="i-date">Date</label>'+
      '<input class="input" type="date" id="i-date" value="'+today()+'"></div>'+
    '<div class="frow">'+
      '<div class="field a"><label for="i-a">Meter A</label>'+
        '<input class="input" type="number" inputmode="numeric" id="i-a" placeholder="'+l.a+'">'+
        '<div class="hint">pichla '+l.a+'</div></div>'+
      '<div class="field b"><label for="i-b">Meter B</label>'+
        '<input class="input" type="number" inputmode="numeric" id="i-b" placeholder="'+l.b+'">'+
        '<div class="hint">pichla '+l.b+'</div></div></div>'+
    '<button class="btn btn-primary" id="save" style="margin-top:var(--space-4)">Save karo</button>'+
    '<button class="btn btn-secondary" id="cancel">Cancel</button>';
  document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
  document.getElementById('save').onclick=saveReading;
  document.getElementById('cancel').onclick=closeSheet;
  setTimeout(function(){var el=document.getElementById('i-a');if(el)el.focus();},380);
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}
function showErr(m){var e=document.getElementById('err');e.textContent=m;e.classList.add('on');}
function toast(m){
  var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},1900);
}

async function saveReading(){
  document.getElementById('err').classList.remove('on');
  var d=document.getElementById('i-date').value||today();
  var a=parseInt(document.getElementById('i-a').value,10);
  var b=parseInt(document.getElementById('i-b').value,10);
  var l=last();
  if(isNaN(a)||isNaN(b))return showErr('Dono meters ki reading dalo.');
  if(a<l.a)return showErr('Meter A ki reading pichli ('+l.a+') se kam hai — dobara dekho.');
  if(b<l.b)return showErr('Meter B ki reading pichli ('+l.b+') se kam hai — dobara dekho.');
  if(a-l.a>400||b-l.b>400)return showErr('Itna bara jump? Number dobara check karo.');
  state.readings.push({date:d,a:a,b:b});
  state.readings.sort(function(x,y){return x.date.localeCompare(y.date);});
  await Store.set('cycle',JSON.stringify(state));
  closeSheet();render();toast('Reading save ho gayi');
}

async function newCycle(){
  if(!confirm('Naya cycle shuru karein? Purana cycle history mein chala jayega.'))return;
  past.unshift({start:state.cycleStart,end:today(),uA:used('a'),uB:used('b')});
  await Store.set('past',JSON.stringify(past));
  var l=last();
  state={cycleStart:today(),baseA:l.a,baseB:l.b,readings:[]};
  await Store.set('cycle',JSON.stringify(state));
  render();toast('Naya cycle shuru');
}

/* ══════════════ PWA icon ══════════════ */
function installIcon(){
  try{
    var c=document.createElement('canvas');c.width=c.height=512;
    var x=c.getContext('2d');
    x.fillStyle='#f5ead8';x.fillRect(0,0,512,512);
    x.fillStyle='#c67139';x.beginPath();x.arc(256,256,196,0,Math.PI*2);x.fill();
    x.fillStyle='#f5ead8';x.beginPath();
    var p=[[292,128],[188,300],[262,300],[238,388],[338,212],[266,212]];
    x.moveTo(p[0][0],p[0][1]);
    for(var i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);
    x.closePath();x.fill();
    var url=c.toDataURL('image/png');
    var ln=document.createElement('link');ln.rel='apple-touch-icon';ln.href=url;document.head.appendChild(ln);
    var mf={name:'Bijli — Meter Tracker',short_name:'Bijli',start_url:'.',display:'standalone',
      background_color:'#f5ead8',theme_color:'#f5ead8',orientation:'portrait',
      icons:[{src:url,sizes:'512x512',type:'image/png',purpose:'any'}]};
    var ml=document.createElement('link');ml.rel='manifest';
    ml.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
    document.head.appendChild(ml);
  }catch(e){}
}

/* ══════════════ INIT ══════════════ */
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
  t.onclick=function(){
    tab=t.getAttribute('data-tab');
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.toggle('on',x===t);});
    Array.prototype.forEach.call(document.querySelectorAll('.panel'),function(p){
      p.classList.toggle('on',p.id==='p-'+tab);});
    render();window.scrollTo({top:0,behavior:'smooth'});
  };
});
document.getElementById('fab').onclick=openSheet;
document.getElementById('scrim').onclick=closeSheet;

(async function init(){
  var raw=await Store.get('cycle');
  try{state=raw?JSON.parse(raw):null;}catch(e){state=null;}
  if(!state||!state.cycleStart){state=JSON.parse(JSON.stringify(SEED));await Store.set('cycle',JSON.stringify(state));}
  var rp=await Store.get('past');
  try{past=rp?JSON.parse(rp):[];}catch(e){past=[];}
  installIcon();render();
})();

})();
</script>
</body>
