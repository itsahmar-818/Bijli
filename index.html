<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f5ead8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="RAMS Electric" />
<meta name="description" content="RAMS Electric - MEPCO dual-meter consumption and changeover tracker" />
<title>RAMS Electric — Meter Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   Organic design system — tokens copied verbatim from styles.css so
   this file stays standalone (no _ds/ folder needed on GitHub Pages).
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --color-bg:#f5ead8;
  --color-surface:#ebddc5;
  --color-text:#201e1d;
  --color-accent:#c67139;
  --color-accent-2:#7a8a5e;
  --color-divider:color-mix(in srgb,#201e1d 16%,transparent);

  --color-neutral-100:#f9f4ed; --color-neutral-200:#eee7db; --color-neutral-300:#dcd3c4;
  --color-neutral-400:#c0b6a5; --color-neutral-500:#a19786; --color-neutral-600:#82796a;
  --color-neutral-700:#645c50; --color-neutral-800:#474238; --color-neutral-900:#2e2b25;

  --color-accent-100:#fff2eb; --color-accent-200:#ffe1d0; --color-accent-300:#ffc6a5;
  --color-accent-400:#f6a06b; --color-accent-500:#d67f48; --color-accent-600:#b2622d;
  --color-accent-700:#8c491a; --color-accent-800:#643312; --color-accent-900:#402310;

  --color-accent-2-100:#f0fae1; --color-accent-2-200:#e1eecc; --color-accent-2-300:#ccdbb2;
  --color-accent-2-400:#aebf92; --color-accent-2-500:#8fa073; --color-accent-2-600:#728157;
  --color-accent-2-700:#56633f; --color-accent-2-800:#3d472b; --color-accent-2-900:#272e1b;

  /* Extension: the system carries no alarm role, and a cost-cliff tracker
     needs one. Kept in the warm family so it sits with the terracotta. */
  --color-alert:#b8402a; --color-alert-100:#ffe3db; --color-alert-700:#8a2a17;

  --font-heading:"Caprasimo",system-ui,sans-serif;
  --font-heading-weight:400;
  --font-body:"Figtree",system-ui,-apple-system,sans-serif;

  --space-1:4.4px; --space-2:8.8px; --space-3:13.2px;
  --space-4:17.6px; --space-6:26.4px; --space-8:35.2px;

  --radius-sm:8px; --radius-md:16px; --radius-lg:28px;

  --shadow-sm:0 1px 2px color-mix(in srgb,#2e2b25 14%,transparent);
  --shadow-md:0 3px 10px color-mix(in srgb,#2e2b25 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2e2b25 22%,transparent);

  --bar-h:66px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--color-bg);}
body{
  margin:0;background:var(--color-bg);color:var(--color-text);
  font-family:var(--font-body);font-size:15px;line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);font-weight:var(--font-heading-weight);
  line-height:1.12;letter-spacing:-.015em;margin:0 0 var(--space-2);}
button,input{font-family:inherit;font-size:inherit;color:inherit;-webkit-appearance:none;appearance:none;border:none;background:none;}
button{cursor:pointer;}
input[type="date"]{color-scheme:light;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent);}

/* ─── shell ─────────────────────────────────────────────── */
#shell{max-width:440px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh;}
#shell::before{
  content:'';position:fixed;top:-90px;right:-70px;width:260px;height:260px;border-radius:50%;
  background:color-mix(in srgb,var(--color-accent) 13%,transparent);pointer-events:none;z-index:0;
}
#shell::after{
  content:'';position:fixed;top:130px;left:-95px;width:190px;height:190px;border-radius:50%;
  background:color-mix(in srgb,var(--color-accent-2) 14%,transparent);pointer-events:none;z-index:0;
}

.appbar{position:sticky;top:0;z-index:50;
  padding:calc(var(--sat) + var(--space-4)) var(--space-4) var(--space-3);
  background:linear-gradient(to bottom,var(--color-bg) 74%,transparent);
  display:flex;align-items:center;gap:var(--space-3);}
.mark{width:38px;height:38px;border-radius:999px;flex:none;
  background:linear-gradient(140deg,var(--color-accent-400),var(--color-accent-700));
  display:grid;place-items:center;box-shadow:var(--shadow-sm);}
.brand{margin-right:auto;min-width:0;}
.brand .n{font-family:var(--font-heading);font-size:19px;line-height:1;white-space:nowrap;}
.brand .s{font-size:10.5px;letter-spacing:.09em;color:var(--color-neutral-600);margin-top:3px;text-transform:uppercase;}

.chip{display:flex;align-items:center;gap:var(--space-2);background:var(--color-surface);
  border-radius:999px;padding:6px 13px 6px 7px;flex:none;}
.chip .t{line-height:1.2;}
.chip .t b{display:block;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.chip .t span{font-size:9.5px;color:var(--color-neutral-600);}
.chip.over .t b{color:var(--color-alert);}

main{position:relative;z-index:1;padding:0 var(--space-4) calc(var(--bar-h) + var(--sab) + var(--space-8));}
.panel{display:none;animation:pin .32s cubic-bezier(.22,1,.36,1);}
.panel.on{display:block;}
@keyframes pin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--color-neutral-600);font-weight:700;margin:var(--space-6) var(--space-2) var(--space-2);}
.eyebrow.first{margin-top:var(--space-2);}

/* ─── card ──────────────────────────────────────────────── */
.card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4);
  border-radius:calc(var(--radius-lg) * 1.15);background:var(--color-surface);
  margin-bottom:var(--space-3);}
.card.flat{gap:0;}
.elev-sm{box-shadow:var(--shadow-sm);}

/* ─── tags ──────────────────────────────────────────────── */
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;
  padding:3px 11px;border-radius:999px;font-weight:600;}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800);}
.tag-accent-2{background:var(--color-accent-2-100);color:var(--color-accent-2-800);}
.tag-alert{background:var(--color-alert-100);color:var(--color-alert-700);}

/* ─── decision card ─────────────────────────────────────── */
.decide{background:var(--color-accent-100);gap:0;}
.decide .row{display:flex;align-items:center;gap:var(--space-4);}
.decide .orb{width:66px;height:66px;flex:none;border-radius:999px;display:grid;place-items:center;
  box-shadow:var(--shadow-md);}
.decide .orb span{font-family:var(--font-heading);font-size:32px;color:var(--color-bg);line-height:1;}
.decide .k{font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--color-accent-700);font-weight:700;}
.decide .h{font-family:var(--font-heading);font-size:23px;line-height:1.12;margin-top:5px;}
.decide .sub{font-size:12px;color:var(--color-neutral-700);margin-top:var(--space-3);}

/* ─── meter card ────────────────────────────────────────── */
.meter{gap:0;}
.meter.a{--ac:var(--color-accent);--ac-d:var(--color-accent-700);}
.meter.b{--ac:var(--color-accent-2);--ac-d:var(--color-accent-2-700);}
.meter .top{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);}
.meter .nm{font-family:var(--font-heading);font-size:19px;line-height:1;}
.meter .sn{font-size:10.5px;color:var(--color-neutral-600);margin-left:auto;
  font-variant-numeric:tabular-nums;}

.mrow{display:flex;align-items:center;gap:var(--space-4);}
.gauge{width:98px;height:98px;flex:none;position:relative;}
.gauge svg{width:100%;height:100%;transform:rotate(135deg);display:block;}
.gauge .trk{fill:none;stroke:var(--color-neutral-300);stroke-width:9;stroke-linecap:round;}
.gauge .prg{fill:none;stroke-width:9;stroke-linecap:round;stroke:var(--ac);
  transition:stroke-dasharray .85s cubic-bezier(.22,1,.36,1);}
.gauge .tck{stroke:var(--color-alert);stroke-width:2.6;stroke-linecap:round;}
.gc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;}
.gc .v{font-family:var(--font-heading);font-size:30px;line-height:1;color:var(--ac-d);}
.gc .l{font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--color-neutral-600);margin-top:3px;font-weight:700;}

.mside{flex:1;min-width:0;}
.head{font-family:var(--font-heading);font-size:34px;line-height:.95;color:var(--ac-d);}
.head-l{font-size:11px;color:var(--color-neutral-700);margin-top:3px;}

.msplit{display:flex;gap:var(--space-2);margin-top:var(--space-4);
  padding-top:var(--space-3);border-top:1px solid var(--color-divider);}
.msplit div{flex:1;}
.msplit .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--color-neutral-600);font-weight:700;}
.msplit .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}
.msplit .v.alert{color:var(--color-alert);}

/* ─── estimate ──────────────────────────────────────────── */
.est{flex-direction:row;gap:0;padding:0;overflow:hidden;}
.est > div{flex:1;padding:var(--space-4);}
.est > div + div{border-left:1px solid var(--color-divider);}
.est .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--color-neutral-600);font-weight:700;}
.est .v{font-family:var(--font-heading);font-size:19px;margin-top:6px;line-height:1.1;}
.est .r{font-size:11px;color:var(--color-neutral-600);font-variant-numeric:tabular-nums;}

/* ─── legend ────────────────────────────────────────────── */
.legend{display:flex;gap:var(--space-2);margin-bottom:var(--space-3);}
.legend div{flex:1;background:var(--color-surface);border-radius:var(--radius-lg);
  padding:var(--space-3) var(--space-2);text-align:center;}
.legend .p{font-family:var(--font-heading);font-size:24px;line-height:1;}
.legend .n{font-size:10px;color:var(--color-neutral-600);margin-top:4px;}

/* ─── segmented ─────────────────────────────────────────── */
.seg{display:flex;border:1px solid var(--color-divider);border-radius:999px;
  overflow:hidden;margin:var(--space-2) 0 var(--space-3);}
.seg button{flex:1;padding:9px;font-size:13px;font-weight:600;}
.seg button + button{border-left:1px solid var(--color-divider);}
.seg button.on{color:var(--color-bg);}
.seg button.on.a{background:var(--color-accent);}
.seg button.on.b{background:var(--color-accent-2);}

/* ─── data list ─────────────────────────────────────────── */
.dl{display:flex;justify-content:space-between;gap:var(--space-4);padding:var(--space-2) 0;
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);font-size:13px;}
.dl:last-child{border-bottom:none;}
.dl dt{color:var(--color-neutral-700);flex:none;}
.dl dd{margin:0;text-align:right;font-weight:600;word-break:break-word;}
.dl dd.n{font-variant-numeric:tabular-nums;letter-spacing:.01em;}
.dl.tot{border-top:1px solid var(--color-divider);border-bottom:none;
  margin-top:var(--space-1);padding-top:var(--space-3);}
.dl.tot dt{font-family:var(--font-heading);font-size:15px;color:var(--color-text);}
.dl.tot dd{font-family:var(--font-heading);font-size:19px;font-weight:400;}
.dl dd.pos{color:var(--color-accent-2-800);}

.cpy{display:flex;align-items:center;gap:var(--space-2);justify-content:flex-end;}
.cpybtn{border:1px solid var(--color-divider);border-radius:999px;padding:3px 11px;
  font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--color-neutral-700);flex:none;}
.cpybtn:active{background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent);}

/* ─── bars ──────────────────────────────────────────────── */
.bars{display:flex;align-items:flex-end;gap:4px;padding-top:var(--space-2);}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
.bwrap{width:100%;height:74px;display:flex;align-items:flex-end;gap:2px;}
.bar{width:100%;border-radius:999px 999px var(--radius-sm) var(--radius-sm);min-height:3px;
  transition:height .7s cubic-bezier(.22,1,.36,1);}
.blab{font-size:8.5px;color:var(--color-neutral-600);white-space:nowrap;}
.blab.rot{transform:rotate(-50deg);height:13px;}

/* ─── rows ──────────────────────────────────────────────── */
.hrow{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0;
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);}
.hrow:last-child{border-bottom:none;}
.hrow .d{font-size:12px;color:var(--color-neutral-700);width:56px;flex:none;}
.hrow .x{margin-left:auto;font-size:10.5px;color:var(--color-neutral-600);font-variant-numeric:tabular-nums;}
.empty{text-align:center;padding:var(--space-8) var(--space-4);
  color:var(--color-neutral-600);font-size:13px;}

/* ─── buttons ───────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:15px;
  line-height:1.2;padding:var(--space-3) calc(var(--space-3) * 1.2);border-radius:999px;
  border:1px solid transparent;width:100%;}
.btn-primary{background:var(--color-accent);color:var(--color-bg);}
.btn-primary:active{background:var(--color-accent-700);}
.btn-secondary{border-color:var(--color-divider);}
.btn-secondary:active{background:color-mix(in srgb,var(--color-text) 14%,transparent);}
.btn + .btn{margin-top:var(--space-2);}

/* ─── FAB ───────────────────────────────────────────────── */
.fab{position:fixed;right:calc(50% - 220px + var(--space-4));
  bottom:calc(var(--bar-h) + var(--sab) + var(--space-4));z-index:60;
  width:58px;height:58px;border-radius:999px;display:grid;place-items:center;
  background:var(--color-accent);color:var(--color-bg);box-shadow:var(--shadow-lg);
  transition:transform .18s;}
.fab:active{transform:scale(.9);background:var(--color-accent-700);}
@media(max-width:472px){.fab{right:var(--space-4);}}

/* ─── tab bar ───────────────────────────────────────────── */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);z-index:70;
  height:calc(var(--bar-h) + var(--sab));padding-bottom:var(--sab);
  background:color-mix(in srgb,var(--color-surface) 93%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--shadow-md);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--color-neutral-600);transition:color .2s;}
.tab.on{color:var(--color-accent-700);}
.tab span{font-size:10px;font-weight:700;}

/* ─── sheet ─────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:80;
  background:color-mix(in srgb,var(--color-neutral-900) 50%,transparent);
  opacity:0;pointer-events:none;transition:opacity .28s;}
.scrim.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(102%);
  width:min(440px,100%);z-index:90;background:var(--color-surface);
  border-radius:calc(var(--radius-lg) * 1.4) calc(var(--radius-lg) * 1.4) 0 0;
  padding:var(--space-2) var(--space-4) calc(var(--space-6) + var(--sab));
  transition:transform .36s cubic-bezier(.22,1,.36,1);box-shadow:var(--shadow-lg);
  max-height:88vh;overflow-y:auto;}
.sheet.on{transform:translateX(-50%) translateY(0);}
.grab{width:40px;height:4px;border-radius:999px;background:var(--color-neutral-400);
  margin:0 auto var(--space-4);}
.sheet h3{font-size:24px;margin-bottom:var(--space-1);}
.sheet .sub{font-size:13px;color:var(--color-neutral-700);margin-bottom:var(--space-6);}

.field{margin-bottom:var(--space-3);}
.field > label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:700;margin-bottom:6px;color:var(--color-neutral-700);}
.field.a > label{color:var(--color-accent-700);}
.field.b > label{color:var(--color-accent-2-700);}
.input{width:100%;min-height:46px;padding:10px 16px;font:inherit;font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--color-text);caret-color:var(--color-accent);
  background:var(--color-bg);border:1px solid var(--color-divider);border-radius:999px;}
.input::placeholder{font-weight:400;color:var(--color-neutral-500);}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0;}
.field.b .input:focus-visible{border-color:var(--color-accent-2);outline-color:var(--color-accent-2);}
.frow{display:flex;gap:var(--space-2);}
.frow .field{flex:1;}
.hint{font-size:10.5px;color:var(--color-neutral-600);margin-top:5px;padding-left:14px;
  font-variant-numeric:tabular-nums;}
.err{background:var(--color-alert-100);color:var(--color-alert-700);font-size:12.5px;
  border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-3);display:none;}
.err.on{display:block;}

.toast{position:fixed;bottom:calc(var(--bar-h) + var(--sab) + var(--space-6));left:50%;
  transform:translateX(-50%) translateY(16px);z-index:100;background:var(--color-neutral-900);
  color:var(--color-neutral-100);border-radius:999px;padding:11px 22px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  box-shadow:var(--shadow-lg);white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

.foot{text-align:center;font-size:10.5px;color:var(--color-neutral-600);line-height:1.7;
  margin-top:var(--space-6);padding:0 var(--space-4);}

/* ═══════════════════════════════════════════════════════════════════
   v2 — dark mode, profile, insights, planner, stats
   New tokens and components only. Nothing existing was changed.
   ═══════════════════════════════════════════════════════════════════ */
html[data-theme="dark"]{
  --color-bg:#191614;
  --color-surface:#241f1c;
  --color-text:#f4ebdd;
  --color-divider:color-mix(in srgb,#f4ebdd 18%,transparent);

  --color-neutral-100:#211d1a; --color-neutral-200:#2b2622; --color-neutral-300:#3b342d;
  --color-neutral-400:#544c42; --color-neutral-500:#7d7365; --color-neutral-600:#a89c8a;
  --color-neutral-700:#c8bcaa; --color-neutral-800:#e0d5c3; --color-neutral-900:#f4ebdd;

  --color-accent:#d9834b;
  --color-accent-100:#33231a; --color-accent-200:#432d20; --color-accent-300:#5c3d29;
  --color-accent-400:#8a5a33; --color-accent-500:#b5743f; --color-accent-600:#d0894f;
  --color-accent-700:#eba86f; --color-accent-800:#f6c79b; --color-accent-900:#fde3c8;

  --color-accent-2:#8fa073;
  --color-accent-2-100:#22271b; --color-accent-2-200:#2e3524; --color-accent-2-300:#3f4931;
  --color-accent-2-400:#5b6a45; --color-accent-2-500:#788a5c; --color-accent-2-600:#93a678;
  --color-accent-2-700:#b3c496; --color-accent-2-800:#cfdcb6; --color-accent-2-900:#e6efd6;

  --color-alert:#e8674a; --color-alert-100:#3a1d16; --color-alert-700:#ff9e86;

  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow-md:0 3px 10px rgba(0,0,0,.55);
  --shadow-lg:0 12px 32px rgba(0,0,0,.62);
}
html[data-theme="dark"] input[type="date"]{color-scheme:dark;}
html[data-theme="dark"] .input{color-scheme:dark;}

/* ─── avatar ────────────────────────────────────────────── */
.mark{overflow:hidden;padding:0;border:none;}
.mark img{width:100%;height:100%;object-fit:cover;display:block;}
.mark .ini{font-family:var(--font-heading);font-size:15px;color:var(--color-bg);letter-spacing:.02em;}
.mark:active{transform:scale(.92);}
.mark{transition:transform .16s;}

.av{border-radius:999px;flex:none;display:grid;place-items:center;overflow:hidden;

.av.s92{width:92px;height:92px;} .av.s92 .ini{font-size:36px;}

.hero{background:linear-gradient(140deg,
      color-mix(in srgb,var(--color-accent) 22%,var(--color-surface)) 0%,
      var(--color-surface) 62%);gap:0;}
.hero .row{display:flex;align-items:center;gap:var(--space-3);}
.hero .who{min-width:0;flex:1;}
.hero .g{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;

.hero .nm2{font-family:var(--font-heading);font-size:21px;line-height:1.1;margin-top:3px;

.hero .meta{font-size:11.5px;color:var(--color-neutral-700);margin-top:3px;}
.hero .gear{width:34px;height:34px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--color-text) 8%,transparent);color:var(--color-neutral-700);}
.hero .gear:active{background:color-mix(in srgb,var(--color-text) 18%,transparent);}
.hero .strip{display:flex;gap:var(--space-2);margin-top:var(--space-4);
  padding-top:var(--space-3);border-top:1px solid var(--color-divider);}
.hero .strip div{flex:1;}
.hero .strip .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--color-neutral-600);font-weight:700;}
.hero .strip .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}

/* ─── insight ───────────────────────────────────────────── */
.ins{display:flex;gap:var(--space-3);align-items:flex-start;
  padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);
  background:var(--color-surface);margin-bottom:var(--space-2);}
.ins .ic{width:30px;height:30px;border-radius:999px;flex:none;display:grid;place-items:center;
  font-size:14px;line-height:1;background:var(--color-bg);}
.ins .tt{font-size:13px;font-weight:700;line-height:1.3;}
.ins .bb{font-size:11.5px;color:var(--color-neutral-700);margin-top:3px;line-height:1.5;}
.ins.alert{background:var(--color-alert-100);}
.ins.alert .ic{box-shadow:inset 0 0 0 1.5px var(--color-alert);}
.ins.alert .tt{color:var(--color-alert-700);}
.ins.warn{background:var(--color-accent-100);}
.ins.warn .ic{box-shadow:inset 0 0 0 1.5px var(--color-accent);}
.ins.good{background:var(--color-accent-2-100);}
.ins.good .ic{box-shadow:inset 0 0 0 1.5px var(--color-accent-2);}

/* ─── plan ──────────────────────────────────────────────── */
.split{display:flex;height:13px;border-radius:999px;overflow:hidden;
  background:var(--color-neutral-300);margin:var(--space-3) 0 var(--space-2);}
.split i{display:block;height:100%;}
.plegend{display:flex;gap:var(--space-3);flex-wrap:wrap;font-size:10.5px;
  color:var(--color-neutral-700);}
.plegend b{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:5px;}
.save-note{margin-top:var(--space-3);padding:var(--space-2) var(--space-3);
  background:var(--color-accent-2-100);color:var(--color-accent-2-800);
  border-radius:var(--radius-md);font-size:11.5px;font-weight:600;}

/* ─── stats ─────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-bottom:var(--space-3);}
.stat{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);}
.stat .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--color-neutral-600);font-weight:700;}
.stat .v{font-family:var(--font-heading);font-size:20px;margin-top:5px;line-height:1.05;}
.stat .r{font-size:10.5px;color:var(--color-neutral-600);margin-top:2px;}

/* ─── what-if ───────────────────────────────────────────── */
.rng{width:100%;height:28px;-webkit-appearance:none;appearance:none;background:transparent;
  display:block;margin:var(--space-2) 0 0;}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--color-neutral-300);}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:999px;
  background:var(--color-accent);margin-top:-9px;box-shadow:var(--shadow-sm);}
.rng::-moz-range-track{height:6px;border-radius:999px;background:var(--color-neutral-300);}
.rng::-moz-range-thumb{width:24px;height:24px;border:none;border-radius:999px;background:var(--color-accent);}
.wfhead{display:flex;align-items:baseline;gap:var(--space-2);}
.wfhead .v{font-family:var(--font-heading);font-size:26px;line-height:1;color:var(--color-accent-700);}
.wfhead .l{font-size:11px;color:var(--color-neutral-700);}
.wfhead .r{margin-left:auto;font-size:11px;color:var(--color-neutral-600);}

/* ─── tappable rows ─────────────────────────────────────── */
.hrow.tap{cursor:pointer;margin:0 calc(var(--space-2) * -1);padding-left:var(--space-2);
  padding-right:var(--space-2);border-radius:var(--radius-md);}
.hrow.tap:active{background:color-mix(in srgb,var(--color-text) 8%,transparent);}
.hrow .chev{color:var(--color-neutral-500);flex:none;display:grid;place-items:center;}

/* ─── sheet rows / settings ─────────────────────────────── */
.srow{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  padding:var(--space-3) 0;font-size:14px;
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);}
.srow:last-of-type{border-bottom:none;}
.srow .si{width:32px;height:32px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:var(--color-bg);color:var(--color-accent-700);}
.srow .st{flex:1;min-width:0;}
.srow .st b{display:block;font-weight:700;font-size:13.5px;}
.srow .st span{display:block;font-size:11px;color:var(--color-neutral-600);margin-top:1px;}
.srow:active{opacity:.6;}
.avpick{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);
  margin-bottom:var(--space-4);}
.avpick .acts{display:flex;gap:var(--space-2);}
.avpick .acts button{border:1px solid var(--color-divider);border-radius:999px;
  padding:6px 14px;font-size:11.5px;font-weight:700;color:var(--color-neutral-700);}
.avpick .acts button:active{background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent);}
textarea.input{border-radius:var(--radius-md);min-height:96px;font-size:12px;font-weight:400;
  resize:vertical;line-height:1.5;}
.seg.three button{font-size:12.5px;}

/* ─── toast w/ action ───────────────────────────────────── */
.toast{display:flex;align-items:center;gap:var(--space-2);}
.toast .act{color:var(--color-accent-400);font-weight:800;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 4px;flex:none;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

<script>

var CLIFF=100, TARGET=150;

var SEED={cycleStart:'2026-07-25',baseA:9604,baseB:4970,
  readings:[{date:'2026-08-13',a:9648,b:5044},{date:'2026-08-20',a:9675,b:5047},

var state=null, past=[], tab='home', billMeter='a';

/* storage: window.storage inside Claude, localStorage on GitHub Pages */
var Store={
  get:async function(k){
    if(window.storage&&window.storage.get){
      try{var r=await window.storage.get(k,false);return r&&r.value?r.value:null;}catch(e){}
    }
    try{return localStorage.getItem('bijli:'+k);}catch(e){return null;}
  },
  set:async function(k,v){
    if(window.storage&&window.storage.set){
      try{await window.storage.set(k,v,false);return true;}catch(e){}
    }
    try{localStorage.setItem('bijli:'+k,v);return true;}catch(e){return false;}
  }
};

function p2(n){return n<10?'0'+n:''+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function fmtD(iso){return new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function addMo(iso,n){var d=new Date(iso+'T00:00:00');d.setMonth(d.getMonth()+n);
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
function rs(n){return Math.round(n).toLocaleString('en-US');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function last(){return state.readings.length?state.readings[state.readings.length-1]:{a:state.baseA,b:state.baseB};}
function used(k){return Math.max(last()[k]-(k==='a'?state.baseA:state.baseB),0);}
function cycleEnd(){return addMo(state.cycleStart,1);}
function daysLeft(){return Math.max(dayDiff(today(),cycleEnd()),0);}
function cycleDay(){return Math.max(dayDiff(state.cycleStart,today()),1);}
function pace(k){return used(k)/cycleDay();}
function projected(k){return Math.round(used(k)+pace(k)*daysLeft());}

/* effective Rs/unit — calibrated against the 24 real bills above */
function rate(u){
  if(u<=50)return 22; if(u<=100)return 24; if(u<=125)return 37;
  if(u<=150)return 43; if(u<=200)return 44; if(u<=300)return 47; return 51;
}
function estimate(u){var m=u*rate(u);return{lo:Math.round(m*0.9/10)*10,hi:Math.round(m*1.1/10)*10};}
function status(u){
  if(u>=CLIFF)return{cls:'tag-alert',txt:'Over cliff'};
  if(u>=CLIFF*0.85)return{cls:'tag-accent',txt:'Close'};
  return{cls:'tag-accent-2',txt:'Safe'};
}

var R=44, ARC=2*Math.PI*R*0.75;
function gaugeSVG(u){
  var frac=Math.min(u/TARGET,1);
  var rad=(135+(CLIFF/TARGET)*270)*Math.PI/180;
  var x1=(60+Math.cos(rad)*(R-7)).toFixed(1), y1=(60+Math.sin(rad)*(R-7)).toFixed(1);
  var x2=(60+Math.cos(rad)*(R+7)).toFixed(1), y2=(60+Math.sin(rad)*(R+7)).toFixed(1);
  return '<svg viewBox="0 0 120 120">'+
    '<circle class="trk" cx="60" cy="60" r="'+R+'" stroke-dasharray="'+ARC.toFixed(1)+' 999"/>'+
    '<circle class="prg" cx="60" cy="60" r="'+R+'" stroke-dasharray="'+(ARC*frac).toFixed(1)+' 999"/>'+
    '<line class="tck" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/></svg>';
}

/* ══════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════ */
var prof={name:'',photo:'',theme:'auto',cliff:100,target:150};
var undoSnap=null, deferredInstall=null, wfRate=null;

function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function median(a){if(!a.length)return 0;var s=a.slice().sort(function(x,y){return x-y;});
  var m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function clamp(n,lo,hi){return Math.max(lo,Math.min(hi,n));}

/* ─── analysis ──────────────────────────────────────────── */
function segments(){
  var out=[],prev={date:state.cycleStart,a:state.baseA,b:state.baseB};
  for(var i=0;i<state.readings.length;i++){
    var c=state.readings[i],d=Math.max(dayDiff(prev.date,c.date),1);
    out.push({date:c.date,days:d,a:(c.a-prev.a)/d,b:(c.b-prev.b)/d,
      t:((c.a-prev.a)+(c.b-prev.b))/d});
    prev=c;
  }
  return out;
}
function combinedPace(){return (used('a')+used('b'))/cycleDay();}
function staleDays(){
  var r=state.readings.length?state.readings[state.readings.length-1].date:state.cycleStart;
  return Math.max(dayDiff(r,today()),0);
}

/* Spread the remaining units across both meters so each one stays
   under the cliff for as long as possible. That is what the
   changeover switch is for. */
function optimalSplit(future){
  var ua=used('a'),ub=used('b');
  var ra=Math.max(CLIFF-ua,0),rb=Math.max(CLIFF-ub,0);
  var xa=0,xb=0,f=Math.max(future,0);
  var fill=Math.min(f,ra+rb);
  if(ra+rb>0){xa=fill*ra/(ra+rb);xb=fill*rb/(ra+rb);}
  f-=fill;xa+=f/2;xb+=f/2;
  return {a:Math.round(ua+xa),b:Math.round(ub+xb)};
}
function costOf(a,b){var x=estimate(a),y=estimate(b);return {lo:x.lo+y.lo,hi:x.hi+y.hi};}

function insights(){
  var out=[],dl=daysLeft(),segs=segments();

  /* Cycle is over. The decision card already says so, so no second nag,
     and no stale-reading reminder either. */
  if(dl===0)return [];

  if(dl<=2)out.push({t:'warn',i:'&#128247;',h:'Reading date is close',
    b:'The meter is read in '+dl+' day'+(dl===1?'':'s')+' ('+fmtD(cycleEnd())+
      '). Photograph both meters so you can check the bill against them.'});

  ['a','b'].forEach(function(k){
    var u=used(k),pc=pace(k);
    if(u>=CLIFF){
      out.push({t:'alert',i:'&#128308;',h:METERS[k].label+' is past the cliff',
        b:u+' units used. Every further unit on this meter bills at the higher rate, '+
          'so keep the changeover on the other one.'});
    }else if(pc>0.05){
      var d=Math.ceil((CLIFF-u)/pc);
      if(d<=dl)out.push({t:'warn',i:'&#9889;',h:METERS[k].label+' hits the cliff in '+d+' day'+(d===1?'':'s'),
        b:'At the current rate it crosses '+CLIFF+' units on '+fmtD(addDays(today(),d))+
          ', with '+dl+' days still left in the cycle.'});
    }
  });

  if(segs.length>=3){
    var lastSeg=segs[segs.length-1];
    var base=median(segs.slice(0,-1).map(function(s){return s.t;}));
    if(base>0.3&&lastSeg.t>base*1.6){
      out.push({t:'alert',i:'&#128200;',h:'Usage has jumped',
        b:'The last '+lastSeg.days+' day'+(lastSeg.days===1?'':'s')+' averaged '+
          lastSeg.t.toFixed(1)+' units a day, '+(lastSeg.t/base).toFixed(1)+'x your usual rate.'});
    }else if(base>0.3&&lastSeg.t<base*0.65){
      out.push({t:'good',i:'&#127807;',h:'Usage is down',
        b:lastSeg.t.toFixed(1)+' units a day, '+Math.round((1-lastSeg.t/base)*100)+
          '% below your usual rate.'});
    }
  }

  if(!out.length)out.push({t:'good',i:'&#9989;',h:'On track',
    b:'Both meters are under the cliff and daily usage is inside the budget.'});
  return out.slice(0,2);
}
function insightHTML(){
  return insights().map(function(o){
    return '<div class="ins '+o.t+'"><div class="ic">'+o.i+'</div>'+
      '<div><div class="tt">'+o.h+'</div><div class="bb">'+o.b+'</div></div></div>';
  }).join('');
}

/* ─── switching plan ────────────────────────────────────── */
function planCard(){
  var dl=daysLeft();if(dl<=0)return '';
  var burn=combinedPace();
  if(burn<0.05)return '';
  var ra=Math.max(CLIFF-used('a'),0),rb=Math.max(CLIFF-used('b'),0);
  var da,db,short;
  if((ra+rb)/burn>=dl){
    /* Together they cover the whole cycle, so split days by headroom. */
    da=Math.round(dl*(ra/(ra+rb||1)));db=dl-da;short=0;
  }else{
    da=Math.floor(ra/burn);db=Math.floor(rb/burn);short=Math.max(dl-da-db,0);
  }
  var first=ra>=rb?'a':'b',second=first==='a'?'b':'a';
  var fd=first==='a'?da:db,sd=first==='a'?db:da;

  var future=burn*dl;
  var opt=optimalSplit(future);
  var optC=costOf(opt.a,opt.b);
  var naiveC=costOf(used('a')+Math.round(future),used('b'));
  var saving=Math.round(((naiveC.lo+naiveC.hi)-(optC.lo+optC.hi))/2);

  var line = short===0
    ? 'Both meters finish the cycle under '+CLIFF+' units.'
    : short+' day'+(short===1?'':'s')+' are not covered, and usage on those days runs past the cliff.';

  return '<div class="eyebrow">Switching plan</div>'+
    '<div class="card elev-sm">'+
      '<div style="font-size:13px;line-height:1.55">'+
        'Stay on <b>'+METERS[first].label+'</b> for about '+fd+' days, then switch to '+
        '<b>'+METERS[second].label+'</b> for about '+sd+'. '+line+
      '</div>'+
      '<div class="split">'+
        '<i style="width:'+(da/dl*100)+'%;background:var(--color-accent)"></i>'+
        '<i style="width:'+(db/dl*100)+'%;background:var(--color-accent-2)"></i>'+
        '<i style="width:'+(short/dl*100)+'%;background:var(--color-alert)"></i>'+
      '</div>'+
      '<div class="plegend">'+
        '<span><b style="background:var(--color-accent)"></b>A · '+da+'d</span>'+
        '<span><b style="background:var(--color-accent-2)"></b>B · '+db+'d</span>'+
        (short?'<span><b style="background:var(--color-alert)"></b>Past cliff · '+short+'d</span>':'')+
      '</div>'+
      (saving>150?'<div class="save-note">&#128176; Switching on plan saves roughly Rs '+rs(saving)+' this cycle.</div>':'')+
    '</div>';
}

function wfUpdate(){
  var dl=daysLeft(),o=optimalSplit(wfRate*dl),c=costOf(o.a,o.b);
  var set=function(id,v,alert){var e=document.getElementById(id);if(!e)return;
    e.textContent=v;e.className='v'+(alert?' alert':'');};
  set('wf-r',wfRate.toFixed(1));
  var r=document.getElementById('wf-r');if(r)r.className='v';
  set('wf-a',o.a,o.a>=CLIFF);set('wf-b',o.b,o.b>=CLIFF);
  var cc=document.getElementById('wf-c');
  if(cc){cc.textContent='Rs '+rs((c.lo+c.hi)/2);cc.className='v';cc.style.fontSize='15px';}
  var n=document.getElementById('wf-n');
  if(n)n.textContent=(o.a>=CLIFF||o.b>=CLIFF)
    ? 'At this rate the cliff cannot be avoided. Usage has to come down.'
    : 'At this rate both meters stay under '+CLIFF+' units.';
}

function dailyBars(){
  var segs=segments();
  if(segs.length<2) return '';
  var mx=Math.max(1,Math.max.apply(null,segs.map(function(s){return Math.max(s.a,s.b);})));
  var dl=daysLeft();
  var la=Math.max(CLIFF-used('a'),0), lb=Math.max(CLIFF-used('b'),0);
  var budget=dl>0?(la+lb)/dl/2:0;                 /* daily target per meter */
  var gline=budget>0&&budget<mx
    ? '<div style="position:absolute;left:0;right:0;bottom:'+(budget/mx*74+19)+'px;height:0;'+
      'border-top:1.5px dashed var(--color-accent-400);pointer-events:none"></div>'+
      '<div style="position:absolute;right:0;bottom:'+(budget/mx*74+22)+'px;font-size:8.5px;'+
      'color:var(--color-accent-700);font-weight:700;pointer-events:none">target '+budget.toFixed(1)+'</div>'
    : '';
  return '<div class="eyebrow">Daily usage</div><div class="card elev-sm">'+
    '<div class="bars" style="position:relative">'+
    segs.map(function(s){
      return '<div class="bcol"><div class="bwrap">'+
        '<div class="bar" style="height:'+(s.a/mx*100)+'%;background:var(--color-accent)"></div>'+
        '<div class="bar" style="height:'+(s.b/mx*100)+'%;background:var(--color-accent-2)"></div>'+
        '</div><div class="blab">'+fmtD(s.date)+'</div></div>';
    }).join('')+gline+'</div></div>';
}

function statsCards(){
  var segs=segments();
  if(!segs.length)return '';
  var tots=segs.map(function(s){return s.t;});
  var hi=segs[0],lo=segs[0];
  segs.forEach(function(s){if(s.t>hi.t)hi=s;if(s.t<lo.t)lo=s;});
  var recent=segs.slice(-3),rAvg=recent.reduce(function(x,s){return x+s.t;},0)/recent.length;
  var trend=segs.length>3?(rAvg-median(tots.slice(0,-3)))/Math.max(median(tots.slice(0,-3)),0.01)*100:0;
  var tArrow=trend>8?'&#9650; '+Math.round(trend)+'%':trend<-8?'&#9660; '+Math.round(-trend)+'%':'steady';
  return '<div class="eyebrow">This cycle at a glance</div><div class="stats">'+
    '<div class="stat"><div class="k">Daily average</div><div class="v">'+
      combinedPace().toFixed(1)+' u</div><div class="r">both meters combined</div></div>'+
    '<div class="stat"><div class="k">Recent trend</div><div class="v">'+tArrow+'</div>'+
      '<div class="r">last 3 entries</div></div>'+
    '<div class="stat"><div class="k">Heaviest stretch</div><div class="v">'+hi.t.toFixed(1)+' u</div>'+
      '<div class="r">up to '+fmtD(hi.date)+'</div></div>'+
    '<div class="stat"><div class="k">Lightest stretch</div><div class="v">'+lo.t.toFixed(1)+' u</div>'+
      '<div class="r">up to '+fmtD(lo.date)+'</div></div>'+
  '</div>';
}

function yearSummary(m){
  var h=m.history, b=m.bill;
  var tu=0,tr=0,peak=h[0];
  h.forEach(function(x){tu+=x.u;tr+=x.rs;if(x.rs>peak.rs)peak=x;});
  var over=h.filter(function(x){return x.u>=CLIFF;}).length;

  /* Same month a year earlier: Jul 25 against the Jul 26 bill. */
  var same=h[0], du=b.units-same.u, dr=b.grandTotal-same.rs;
  var pu=same.u?Math.round(du/same.u*100):0;
  var tone=du>0?'var(--color-alert)':'var(--color-accent-2-800)';

  return '<div class="eyebrow first">Year at a glance</div>'+
    '<div class="stats">'+
      '<div class="stat"><div class="k">Units, 12 months</div><div class="v">'+rs(tu)+'</div>'+
        '<div class="r">daily average '+(tu/365).toFixed(1)+' u</div></div>'+
      '<div class="stat"><div class="k">Spend, 12 months</div><div class="v">Rs '+rs(tr)+'</div>'+
        '<div class="r">Rs '+rs(tr/12)+' a month</div></div>'+
      '<div class="stat"><div class="k">Costliest month</div><div class="v">'+peak.m+'</div>'+
        '<div class="r">'+peak.u+' u &middot; Rs '+rs(peak.rs)+'</div></div>'+
      '<div class="stat"><div class="k">Over the cliff</div><div class="v">'+over+'/12</div>'+
        '<div class="r">of the last 12 months</div></div>'+
    '</div>'+
    '<div class="card elev-sm">'+
      '<div class="dl"><dt>'+b.month+' vs '+same.m+' &middot; units</dt>'+
        '<dd class="n" style="color:'+tone+'">'+(du>0?'+':'')+du+' u ('+(pu>0?'+':'')+pu+'%)</dd></div>'+
      '<div class="dl"><dt>'+b.month+' vs '+same.m+' &middot; bill</dt>'+
        '<dd class="n" style="color:'+tone+'">'+(dr>0?'+ Rs ':'&minus; Rs ')+rs(Math.abs(dr))+'</dd></div>'+
      '<div class="dl"><dt>Status</dt><dd><span class="tag '+

        '</span></dd></div>'+

function copy(v){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(function(){toast('Copied');},function(){toast('Copy failed');});
  }else{
    var ta=document.createElement('textarea');ta.value=v;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Copied');}catch(e){toast('Copy failed');}
    document.body.removeChild(ta);
  }
}

/* Shows units used and headroom left as soon as a number is typed. */
function liveHint(k,prevVal){
  var inp=document.getElementById('i-'+k), hint=document.getElementById('h-'+k);
  if(!inp||!hint)return;
  var base=k==='a'?state.baseA:state.baseB;
  inp.oninput=function(){
    var v=parseInt(inp.value,10);
    if(isNaN(v)){hint.textContent='last '+prevVal;hint.style.color='';return;}
    var d=v-prevVal, tot=v-base, left=CLIFF-tot;
    hint.innerHTML='+'+d+' u &middot; cycle '+tot+' u &middot; '+
      (left>=0?left+' left':Math.abs(left)+' over cliff');
    hint.style.color=left<0?'var(--color-alert)':left<=15?'var(--color-accent-700)':'';
  };
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}
function showErr(m){var e=document.getElementById('err');e.textContent=m;e.classList.add('on');}
function toast(m,actLabel,actFn){
  var t=document.getElementById('toast');
  t.innerHTML='<span></span>';
  t.firstChild.textContent=m;
  if(actLabel&&actFn){
    var b=document.createElement('button');
    b.className='act';b.textContent=actLabel;
    b.onclick=function(){t.classList.remove('on');clearTimeout(t._h);actFn();};
    t.appendChild(b);
  }
  t.classList.add('on');
  clearTimeout(t._h);
  t._h=setTimeout(function(){t.classList.remove('on');},actLabel?4200:1900);
}

async function saveReading(){
  document.getElementById('err').classList.remove('on');
  var d=document.getElementById('i-date').value||today();
  var a=parseInt(document.getElementById('i-a').value,10);
  var b=parseInt(document.getElementById('i-b').value,10);
  var l=last();
  if(isNaN(a)||isNaN(b))return showErr('Enter both meter readings.');
  if(a<l.a)return showErr('Meter A reading is below the last one ('+l.a+'). Please check it.');
  if(b<l.b)return showErr('Meter B reading is below the last one ('+l.b+'). Please check it.');
  if(a-l.a>400||b-l.b>400)return showErr('That jump looks too large. Please re-check the numbers.');
  undoSnap=JSON.stringify(state);
  state.readings.push({date:d,a:a,b:b});
  state.readings.sort(function(x,y){return x.date.localeCompare(y.date);});
  await Store.set('cycle',JSON.stringify(state));
  closeSheet();render();buzz(14);
  toast('Reading saved','Undo',undoLast);
}

async function undoLast(){
  if(!undoSnap)return;
  try{state=JSON.parse(undoSnap);}catch(e){return;}
  undoSnap=null;
  await Store.set('cycle',JSON.stringify(state));
  render();toast('Undone');
}

async function newCycle(){
  if(!confirm('Start a new cycle? The current one moves into history.'))return;
  past.unshift({start:state.cycleStart,end:today(),uA:used('a'),uB:used('b')});
  await Store.set('past',JSON.stringify(past));
  var l=last();
  state={cycleStart:today(),baseA:l.a,baseB:l.b,readings:[]};
  await Store.set('cycle',JSON.stringify(state));
  render();toast('New cycle started');
}

/* Compress the photo to a 260px square so storage stays small. */
function shrinkImage(file,cb){
  try{
    var fr=new FileReader();
    fr.onerror=function(){cb(null,true);};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){cb(null,true);};
      img.onload=function(){
        try{
          var S=260,c=document.createElement('canvas');c.width=c.height=S;
          var x=c.getContext('2d');
          var side=Math.min(img.width,img.height);
          x.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
          cb(c.toDataURL('image/jpeg',0.82),null);
        }catch(e){cb(null,true);}
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  }catch(e){cb(null,true);}
}

/* ══════════════ BACKUP ══════════════ */
function backupJSON(){
  return JSON.stringify({app:'rams-electric',v:2,at:new Date().toISOString(),
    cycle:state,past:past,profile:prof},null,1);
}
function exportBackup(){
  try{
    var blob=new Blob([backupJSON()],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='rams-electric-backup-'+today()+'.json';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
    toast('Backup downloaded');
  }catch(e){copy(backupJSON());}
}
function openImport(){
  document.getElementById('sheet').innerHTML=
    '<div class="grab"></div><h3>Restore backup</h3>'+
    '<div class="sub">Paste a saved backup here. It replaces the data currently in the app.</div>'+
    '<div class="err" id="err"></div>'+
    '<div class="field"><label for="imp">Backup JSON</label>'+
      '<textarea class="input" id="imp" placeholder=\'{"app":"bijli", ...}\'></textarea></div>'+
    '<button class="btn btn-primary" id="impGo" style="margin-top:var(--space-2)">Restore</button>'+
    '<button class="btn btn-secondary" id="impBack">Back</button>';
  document.getElementById('impBack').onclick=openProfile;
  document.getElementById('impGo').onclick=async function(){
    document.getElementById('err').classList.remove('on');
    var raw=document.getElementById('imp').value.trim();
    var d;
    try{d=JSON.parse(raw);}catch(e){return showErr('That is not valid JSON.');}
    if(!d||!d.cycle||!d.cycle.cycleStart||!Array.isArray(d.cycle.readings))
      return showErr('No cycle data found in this backup.');
    undoSnap=JSON.stringify(state);
    state=d.cycle;
    past=Array.isArray(d.past)?d.past:past;
    if(d.profile&&typeof d.profile==='object'){
      prof.name=d.profile.name||prof.name;
      prof.photo=d.profile.photo||prof.photo;
      prof.theme=d.profile.theme||prof.theme;
      prof.cliff=d.profile.cliff||prof.cliff;
      prof.target=d.profile.target||prof.target;
      CLIFF=prof.cliff;TARGET=prof.target;
      await saveProf();applyTheme();renderAvatar();
    }
    await Store.set('cycle',JSON.stringify(state));
    await Store.set('past',JSON.stringify(past));
    closeSheet();render();toast('Backup restored','Undo',undoLast);
  };
}

/* ══════════════ APP ICON ══════════════ */
/* The launcher mark is drawn on a canvas at runtime: a dark plate, a
   copper ring and a gilded bolt. Keeps the app a single HTML file with
   no image assets to upload alongside it. */
function boltPath(x,cx,cy,hgt){
  var s=hgt/20, p=[[13,2],[4,14],[11,14],[10,22],[19,10],[12,10]];
  x.beginPath();
  for(var i=0;i<p.length;i++){
    var px=cx+(p[i][0]-11.5)*s, py=cy+(p[i][1]-12)*s;
    if(i===0)x.moveTo(px,py); else x.lineTo(px,py);
  }
  x.closePath();
}
function drawIcon(S,inset){
  var c=document.createElement('canvas');c.width=c.height=S;
  var x=c.getContext('2d'), C=S/2;

  var plate=x.createLinearGradient(0,0,S,S);
  plate.addColorStop(0,'#221709');plate.addColorStop(.48,'#0b0908');plate.addColorStop(1,'#241608');
  x.fillStyle=plate;x.fillRect(0,0,S,S);

  var glow=x.createRadialGradient(C,S*.42,0,C,S*.42,S*.50);
  glow.addColorStop(0,'rgba(240,160,90,.30)');glow.addColorStop(1,'rgba(240,160,90,0)');
  x.fillStyle=glow;x.fillRect(0,0,S,S);

  var vig=x.createRadialGradient(C,C,S*.30,C,C,S*.74);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.62)');
  x.fillStyle=vig;x.fillRect(0,0,S,S);

  var R=S*inset;

  var ring=x.createLinearGradient(C-R,C-R,C+R,C+R);
  ring.addColorStop(0,'#fff1d8');ring.addColorStop(.34,'#ffbe7d');
  ring.addColorStop(.66,'#d3762f');ring.addColorStop(1,'#69320c');
  x.save();
  x.shadowColor='rgba(255,166,90,.70)';x.shadowBlur=S*.070;
  x.strokeStyle=ring;x.lineWidth=S*.031;
  x.beginPath();x.arc(C,C,R,0,Math.PI*2);x.stroke();
  x.restore();

  x.strokeStyle='rgba(255,230,198,.20)';x.lineWidth=Math.max(S*.005,1);
  x.beginPath();x.arc(C,C,R-S*.053,0,Math.PI*2);x.stroke();

  var hgt=R*1.30;
  boltPath(x,C,C+S*.015,hgt);x.fillStyle='rgba(0,0,0,.55)';x.fill();

  var body=x.createLinearGradient(C,C-hgt/2,C,C+hgt/2);
  body.addColorStop(0,'#fffaf2');body.addColorStop(.30,'#ffd7a0');
  body.addColorStop(.66,'#f4a154');body.addColorStop(1,'#bf6c22');
  boltPath(x,C,C,hgt);x.fillStyle=body;x.fill();

  x.save();boltPath(x,C,C,hgt);x.clip();
  var sheen=x.createLinearGradient(C-hgt*.30,C-hgt*.5,C+hgt*.22,C*1.02);
  sheen.addColorStop(0,'rgba(255,255,255,.48)');sheen.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=sheen;x.fillRect(C-hgt,C-hgt,hgt*2,hgt);
  x.restore();

  return c.toDataURL('image/png');
}
function installIcon(){
  try{
    var big=drawIcon(512,0.355), mask=drawIcon(512,0.270), small=drawIcon(192,0.355);

    var fav=document.createElement('link');
    fav.rel='icon';fav.type='image/png';fav.href=small;document.head.appendChild(fav);

    var ln=document.createElement('link');ln.rel='apple-touch-icon';ln.href=big;
    document.head.appendChild(ln);

    var mf={name:'RAMS Electric — Meter Tracker',short_name:'RAMS Electric',
      description:'MEPCO dual-meter consumption and changeover tracker',
      start_url:'.',display:'standalone',background_color:'#f5ead8',theme_color:'#f5ead8',
      orientation:'portrait',
      icons:[{src:small,sizes:'192x192',type:'image/png',purpose:'any'},
             {src:big,sizes:'512x512',type:'image/png',purpose:'any'},
             {src:mask,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
    var ml=document.createElement('link');ml.rel='manifest';
    ml.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
    document.head.appendChild(ml);
  }catch(e){}
}

/* ══════════════ INIT ══════════════ */
var TABS=['home','log','bills'];
function setTab(name){
  if(TABS.indexOf(name)<0||name===tab)return;
  tab=name;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){
    x.classList.toggle('on',x.getAttribute('data-tab')===tab);});
  Array.prototype.forEach.call(document.querySelectorAll('.panel'),function(p){
    p.classList.toggle('on',p.id==='p-'+tab);});
  render();window.scrollTo({top:0,behavior:'smooth'});
}
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
  t.onclick=function(){buzz(6);setTab(t.getAttribute('data-tab'));};
});

/* Swipe left or right to change tabs. */
(function(){
  var x0=null,y0=null,t0=0;
  var m=document.querySelector('main');
  m.addEventListener('touchstart',function(e){
    if(e.touches.length!==1){x0=null;return;}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();
  },{passive:true});
  m.addEventListener('touchend',function(e){
    if(x0===null)return;
    if(document.getElementById('sheet').classList.contains('on')){x0=null;return;}
    var t=e.changedTouches[0];
    var dx=t.clientX-x0, dy=t.clientY-y0;
    x0=null;
    if(Date.now()-t0>600)return;
    if(Math.abs(dx)<64||Math.abs(dy)>44)return;
    var i=TABS.indexOf(tab)+(dx<0?1:-1);
    if(i>=0&&i<TABS.length){buzz(6);setTab(TABS[i]);}
  },{passive:true});
})();

document.getElementById('fab').onclick=function(){buzz(8);openSheet();};
document.getElementById('scrim').onclick=closeSheet;
document.getElementById('avatarBtn').onclick=function(){buzz(8);openProfile();};
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&document.getElementById('sheet').classList.contains('on'))closeSheet();
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;});

(async function init(){
  var rpf=await Store.get('profile');
  try{
    var pj=rpf?JSON.parse(rpf):null;
    if(pj&&typeof pj==='object'){
      prof.name=pj.name||'';prof.photo=pj.photo||'';
      prof.theme=pj.theme||'auto';
      prof.cliff=pj.cliff||100;prof.target=pj.target||150;
    }
  }catch(e){}
  CLIFF=prof.cliff;TARGET=prof.target;
  applyTheme();renderAvatar();

  var raw=await Store.get('cycle');
  try{state=raw?JSON.parse(raw):null;}catch(e){state=null;}
  if(!state||!state.cycleStart){state=JSON.parse(JSON.stringify(SEED));await Store.set('cycle',JSON.stringify(state));}
  if(!Array.isArray(state.readings))state.readings=[];
  var rp=await Store.get('past');
  try{past=rp?JSON.parse(rp):[];}catch(e){past=[];}
  if(!Array.isArray(past))past=[];
  installIcon();render();
})();

})();
